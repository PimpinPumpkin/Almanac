name: Tests

# The matcher tests and a syntax check of every script, on each push.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "reports/**", "COVERAGE.md"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install DuckDB
        run: |
          curl -fsSL -o duckdb.zip "https://github.com/duckdb/duckdb/releases/download/v1.5.4/duckdb_cli-linux-amd64.zip"
          unzip -q duckdb.zip && sudo mv duckdb /usr/local/bin/ && rm duckdb.zip
      - name: Matcher tests
        run: duckdb < tests/match_test.sql
      - name: Scripts parse
        run: |
          for f in *.sh base/*.sh signals/*.sh adapters/*.sh lib/common.sh; do bash -n "$f"; done
          python3 -m py_compile adapters/*.py base/*.py lib/*.py signals/*.py tools/*.py
          jq -e . docs/coverage.json > /dev/null
      - name: Every adapter is listed in SOURCES.md
        run: |
          missing=0
          for f in adapters/*; do
            name="$(basename "$f" | sed 's/\..*//')"
            grep -qi "$name\|$(echo "$name" | tr _ ' ')" SOURCES.md README.md || { echo "not documented: $name"; missing=1; }
          done
          exit $missing
